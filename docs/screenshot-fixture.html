<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Action Explorer screenshot fixture</title>
    <script type="module" src="/custom_components/action_explorer/www/action-explorer-panel.js"></script>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f5f7fb; }
      body { width: 1280px; height: 860px; overflow: hidden; }
    </style>
  </head>
  <body>
    <action-explorer-panel></action-explorer-panel>
    <script>
      customElements.whenDefined('action-explorer-panel').then(() => {
      const panel = document.querySelector('action-explorer-panel');
      panel.panel = { config: { apiBase: '/api/action_explorer' } };
      const entities = [
        { entity_id: 'light.kitchen_island', name: 'Kitchen Island', domain: 'light', state: 'on' },
        { entity_id: 'climate.living_room', name: 'Living Room Climate', domain: 'climate', state: 'heat' },
        { entity_id: 'media_player.family_room', name: 'Family Room TV', domain: 'media_player', state: 'paused' }
      ];
      const actions = [
        { service: 'light.turn_on', name: 'Turn on', description: 'Turn the light on with optional brightness and transition.', recommended: true, fields: { brightness_pct: {} }, example_data: { brightness_pct: 70 } },
        { service: 'light.turn_off', name: 'Turn off', description: 'Turn the light off.', recommended: true, fields: {}, example_data: {} },
        { service: 'light.toggle', name: 'Toggle', description: 'Toggle the light state.', recommended: true, fields: {}, example_data: {} }
      ];
      panel.hass = {
        callApi(method, path, body) {
          if (path.includes('/entities')) return Promise.resolve({ entities });
          if (path.includes('/actions/')) return Promise.resolve({ entity: entities[0], actions });
          if (path.includes('/automation')) return Promise.resolve({ automation_yaml: `alias: Run light.turn_on for light.kitchen_island\ndescription: Generated by Action Explorer. Review before saving.\ntriggers: []\nconditions: []\nactions:\n  - action: light.turn_on\n    target:\n      entity_id: light.kitchen_island\n    data:\n      brightness_pct: 70\nmode: single\n` });
          return Promise.reject(new Error('unexpected API path ' + path));
        }
      };
      setTimeout(() => panel.selectEntity('light.kitchen_island'), 50);
      setTimeout(() => panel.generateAutomation(actions[0]), 100);
      });
    </script>
  </body>
</html>
